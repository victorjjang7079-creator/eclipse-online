<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECLIPSE | 황혼의 서약</title><link rel="stylesheet" href="style.css"></head><body>
<div id="auth" class="screen auth"><div class="stars"></div><div class="gate"><div class="halo"></div><div class="arch">✦</div></div><div class="authbox"><div class="eyebrow">THE CELESTIAL GATE</div><h1>ECLIPSE</h1><p>황혼의 서약 · 잊혀진 왕국</p><div class="tabs"><button id="loginTab" class="selected">로그인</button><button id="signupTab">회원가입</button></div><input id="email" placeholder="이메일" type="email" autocomplete="email"><input id="password" placeholder="비밀번호 (6자 이상)" type="password"><button id="authSubmit" class="gold">천상의 문 열기</button><button id="guestStart" class="guestbtn" type="button">✧ 게스트로 시작하기</button><div class="guestnote">게스트 기록은 저장되지 않으며 새로고침하면 사라집니다.</div><div id="authMsg" class="message"></div><small id="modeNote">체험판: 계정은 이 브라우저에만 저장됩니다.</small></div></div>
<div id="creator" class="screen hidden"><div class="panel create"><div class="eyebrow">AWAKEN, GUARDIAN</div><h2>수호자의 탄생</h2><p>너의 운명이 지금 시작된다.</p><input id="heroName" maxlength="14" placeholder="캐릭터 이름 (2~14자)"><div class="classes" id="classes"></div><button id="createHero" class="gold">운명 선택하기</button><button id="backAuth" class="secondary">로그아웃</button><div id="createMsg" class="message"></div></div></div>
<div id="loading" class="screen hidden"><div class="wings">✧</div><div class="eyebrow">THE DESCENT OF LIGHT</div><h1>빛의 수호자가 강림한다</h1><div class="progress"><div id="progressBar"></div></div><p id="loadingText">천상의 문이 열리고 있습니다...</p></div>
<div id="game" class="hidden"><canvas id="world"></canvas><div id="hud"><div class="hudtop"><div class="player panel"><div><strong id="hudName"></strong> <span id="hudLevel"></span></div><div class="bar hp"><div id="hpFill"></div></div><div class="bar mp"><div id="mpFill"></div></div><div class="tiny" id="statsText"></div></div><div class="topright"><div class="panel location">✦ 에르딘 초원 <span id="onlineStatus">● 오프라인</span></div><div class="panel quest"><b>메인 퀘스트 · 첫 번째 서약</b><div id="questText">그림자 3마리 처치 (0/3)</div></div></div></div><div class="bottomleft panel"><div id="chatLog"></div><input id="chatInput" placeholder="Enter: 채팅" maxlength="100"></div><div class="bottomcenter"><div id="skills"></div><div class="menu"><button data-panel="character">C 캐릭터</button><button data-panel="inventory">I 가방</button><button data-panel="enhance">H 강화</button><button data-panel="skilltree">K 스킬</button><button data-panel="quests">J 퀘스트</button><button data-panel="settings">ESC 설정</button></div></div><div id="toast"></div><div id="modal" class="hidden"><div class="panel modalbody"><button id="closeModal" class="close">✕</button><h2 id="modalTitle"></h2><div id="modalContent"></div></div></div><div class="hint">WASD 이동 · 클릭 공격 · 1~5 스킬 · Q 회복 · E 대화</div></div></div>
<script src="config.js"></script><script src="game.js"></script></body></html>
